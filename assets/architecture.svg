<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" role="img" aria-label="Navigation tree: one NavigationRoot creates the root Navigator and its UINavigationController; each presented sheet gets a child Navigator and its own stack; every navigator shares one NavigationContext holding the route registry, deep-link router, queue, event handler and screen decorator.">
<title>Navigation tree: one NavigationRoot creates the root Navigator and its UINavigationController; each presented sheet gets a child Navigator and its own stack; every navigator shares one NavigationContext holding the route registry, deep-link router, queue, event handler and screen decorator.</title>
<defs>
<linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#f05138"/><stop offset="50%" stop-color="#d946ef"/><stop offset="100%" stop-color="#a855f7"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
<style>
.frame  { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
.lane   { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
.screen { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
.api    { fill: #fff1ee; stroke: #f05138; stroke-width: 1.5; }
.uikit  { fill: #f5efff; stroke: #a855f7; stroke-width: 1.5; }
.shared { fill: #fdf0fd; stroke: #d946ef; stroke-width: 1.5; stroke-dasharray: 6 4; }
.edge   { stroke: #8b949e; stroke-width: 1.5; fill: none; }
.dashed { stroke-dasharray: 5 4; }
.title  { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
.label  { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
.note   { font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #57606a; }
.code   { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; fill: #1f2328; }
.badge  { fill: url(#brand); }
.badge-text { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
@media (prefers-color-scheme: dark) {
  .frame  { fill: #0d1117; stroke: #30363d; }
  .lane   { fill: #161b22; stroke: #30363d; }
  .screen { fill: #0d1117; stroke: #30363d; }
  .api    { fill: #2a1410; }
  .uikit  { fill: #1f1530; }
  .shared { fill: #261229; }
  .title, .label, .code { fill: #e6edf3; }
  .note   { fill: #8b949e; }
}
</style>
</defs>
  <rect class="frame" x="1" y="1" width="998" height="518" rx="16"/>
  <text class="title" x="32" y="44">The navigation tree</text>
  <text class="note" x="32" y="68">One NavigationRoot, one Navigator per stack, one context shared by the whole tree.</text>
  <rect class="api" x="640" y="28" width="14" height="14" rx="3"/>
  <text class="note" x="660" y="40">public API</text>
  <rect class="uikit" x="770" y="28" width="14" height="14" rx="3"/>
  <text class="note" x="790" y="40">UIKit layer</text>
  <rect class="shared" x="880" y="28" width="14" height="14" rx="3"/>
  <text class="note" x="900" y="40">shared state</text>
  <rect class="api" x="400" y="88" width="200" height="52" rx="10"/>
  <text class="label" x="500" y="110" text-anchor="middle">NavigationRoot</text>
  <text class="note" x="500" y="128" text-anchor="middle">SwiftUI entry point</text>
  <rect class="lane" x="40" y="168" width="410" height="232" rx="12"/>
  <text class="label" x="60" y="194">Root stack</text>
  <rect class="api" x="60" y="208" width="180" height="48" rx="10"/>
  <text class="label" x="150" y="229" text-anchor="middle">Navigator</text>
  <text class="note" x="150" y="245" text-anchor="middle">routes · depth</text>
  <rect class="uikit" x="60" y="280" width="180" height="104" rx="10"/>
  <text class="label" x="150" y="304" text-anchor="middle">StackController</text>
  <text class="note" x="150" y="324" text-anchor="middle">UINavigationController</text>
  <text class="note" x="150" y="342" text-anchor="middle">pop guards · transitions</text>
  <path class="edge" d="M 150 256 L 150 280" marker-end="url(#arrow)"/>
  <rect class="screen" x="256" y="336" width="180" height="36" rx="8"/>
  <text class="code" x="266" y="358.5">HomeView</text>
  <text class="note" x="426" y="358.5" text-anchor="end">root</text>
  <rect class="screen" x="256" y="292" width="180" height="36" rx="8"/>
  <text class="code" x="266" y="314.5">ProfileView</text>
  <rect class="screen" x="256" y="248" width="180" height="36" rx="8"/>
  <text class="code" x="266" y="270.5">SettingsView</text>
  <text class="note" x="256" y="242">screens: RouteHostingController</text>
  <rect class="lane" x="550" y="168" width="410" height="232" rx="12"/>
  <text class="label" x="570" y="194">Sheet: its own stack</text>
  <rect class="api" x="570" y="208" width="180" height="48" rx="10"/>
  <text class="label" x="660" y="229" text-anchor="middle">Navigator</text>
  <text class="note" x="660" y="245" text-anchor="middle">isModal = true</text>
  <rect class="uikit" x="570" y="280" width="180" height="104" rx="10"/>
  <text class="label" x="660" y="304" text-anchor="middle">StackController</text>
  <text class="note" x="660" y="324" text-anchor="middle">UINavigationController</text>
  <text class="note" x="660" y="342" text-anchor="middle">pageSheet / fullScreen</text>
  <path class="edge" d="M 660 256 L 660 280" marker-end="url(#arrow)"/>
  <rect class="screen" x="766" y="336" width="180" height="36" rx="8"/>
  <text class="code" x="776" y="358.5">EditorView</text>
  <rect class="screen" x="766" y="292" width="180" height="36" rx="8"/>
  <text class="code" x="776" y="314.5">FiltersView</text>
  <path class="edge" d="M 500 140 L 500 154 L 150 154 L 150 208" marker-end="url(#arrow)"/>
  <path class="edge" d="M 240 222 L 570 222" marker-end="url(#arrow)"/>
  <text class="code" x="500" y="214" text-anchor="middle">present</text>
  <text class="note" x="500" y="240" text-anchor="middle">weak parent</text>
  <rect class="shared" x="40" y="424" width="920" height="76" rx="12"/>
  <text class="label" x="60" y="448">NavigationContext: shared by every navigator in the tree</text>
  <rect class="screen" x="60" y="460" width="160" height="28" rx="6"/>
  <text class="code" x="140.0" y="478.5" text-anchor="middle">RouteRegistry</text>
  <rect class="screen" x="236" y="460" width="160" height="28" rx="6"/>
  <text class="code" x="316.0" y="478.5" text-anchor="middle">DeepLinkRouter</text>
  <rect class="screen" x="412" y="460" width="160" height="28" rx="6"/>
  <text class="code" x="492.0" y="478.5" text-anchor="middle">NavigationQueue</text>
  <rect class="screen" x="588" y="460" width="160" height="28" rx="6"/>
  <text class="code" x="668.0" y="478.5" text-anchor="middle">eventHandler</text>
  <rect class="screen" x="764" y="460" width="160" height="28" rx="6"/>
  <text class="code" x="844.0" y="478.5" text-anchor="middle">decorateScreens</text>
</svg>

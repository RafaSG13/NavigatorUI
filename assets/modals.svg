<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="100%" role="img" aria-label="Each sheet or full-screen cover gets its own Navigator and UINavigationController: the root stack holds HomeView and ProfileView, a sheet holds EditorView and FiltersView, a cover holds OnboardingView; dismiss, dismissModal and dismissAll close them in different ways.">
<title>Each sheet or full-screen cover gets its own Navigator and UINavigationController: the root stack holds HomeView and ProfileView, a sheet holds EditorView and FiltersView, a cover holds OnboardingView; dismiss, dismissModal and dismissAll close them in different ways.</title>
<defs>
<linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#f05138"/><stop offset="50%" stop-color="#d946ef"/><stop offset="100%" stop-color="#a855f7"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker>
<style>
.frame  { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
.lane   { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
.screen { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
.api    { fill: #fff1ee; stroke: #f05138; stroke-width: 1.5; }
.uikit  { fill: #f5efff; stroke: #a855f7; stroke-width: 1.5; }
.shared { fill: #fdf0fd; stroke: #d946ef; stroke-width: 1.5; stroke-dasharray: 6 4; }
.edge   { stroke: #8b949e; stroke-width: 1.5; fill: none; }
.dashed { stroke-dasharray: 5 4; }
.title  { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
.label  { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
.note   { font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #57606a; }
.code   { font: 500 13px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; fill: #1f2328; }
.badge  { fill: url(#brand); }
.badge-text { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
@media (prefers-color-scheme: dark) {
  .frame  { fill: #0d1117; stroke: #30363d; }
  .lane   { fill: #161b22; stroke: #30363d; }
  .screen { fill: #0d1117; stroke: #30363d; }
  .api    { fill: #2a1410; }
  .uikit  { fill: #1f1530; }
  .shared { fill: #261229; }
  .title, .label, .code { fill: #e6edf3; }
  .note   { fill: #8b949e; }
}
</style>
</defs>
  <rect class="frame" x="1" y="1" width="998" height="438" rx="16"/>
  <text class="title" x="32" y="44">Each modal is its own stack</text>
  <text class="note" x="32" y="68">Sheets and full-screen covers get their own Navigator and UINavigationController.</text>
  <rect class="lane" x="40" y="96" width="260" height="230" rx="24"/>
  <text class="label" x="60" y="126">Root stack</text>
  <text class="note" x="60" y="146">Navigator · root</text>
  <rect class="screen" x="60" y="272" width="220" height="34" rx="8"/>
  <text class="code" x="170.0" y="293.5" text-anchor="middle">HomeView</text>
  <rect class="screen" x="60" y="230" width="220" height="34" rx="8"/>
  <text class="code" x="170.0" y="251.5" text-anchor="middle">ProfileView</text>
  <rect class="uikit" x="370" y="96" width="260" height="230" rx="24"/>
  <text class="label" x="390" y="126">Sheet</text>
  <text class="note" x="390" y="146">Navigator · isModal</text>
  <text class="note" x="390" y="164">push(.filters) lands here</text>
  <rect class="screen" x="390" y="272" width="220" height="34" rx="8"/>
  <text class="code" x="500.0" y="293.5" text-anchor="middle">EditorView</text>
  <rect class="screen" x="390" y="230" width="220" height="34" rx="8"/>
  <text class="code" x="500.0" y="251.5" text-anchor="middle">FiltersView</text>
  <rect class="uikit" x="700" y="96" width="260" height="230" rx="24"/>
  <text class="label" x="720" y="126">Full-screen cover</text>
  <text class="note" x="720" y="146">Navigator · isModal</text>
  <rect class="screen" x="720" y="272" width="220" height="34" rx="8"/>
  <text class="code" x="830.0" y="293.5" text-anchor="middle">OnboardingView</text>
  <rect class="badge" x="884" y="108" width="56" height="22" rx="11"/>
  <text class="badge-text" x="912" y="123.5" text-anchor="middle">visible</text>
  <path class="edge" d="M 300 200 L 370 200" marker-end="url(#arrow)"/>
  <path class="edge" d="M 630 200 L 700 200" marker-end="url(#arrow)"/>
  <text class="code" x="335" y="188" text-anchor="middle">present</text>
  <text class="code" x="665" y="188" text-anchor="middle">present</text>
  <text class="code" x="40" y="370">dismiss()</text>
  <text class="note" x="40" y="392">pops first; at the root, closes</text>
  <text class="code" x="270" y="370">dismissModal()</text>
  <text class="note" x="270" y="392">closes this modal and any above</text>
  <text class="code" x="500" y="370">dismissAll()</text>
  <text class="note" x="500" y="392">closes every modal</text>
  <text class="code" x="730" y="370">present(…)</text>
  <text class="note" x="730" y="392">from a covered stack: on top</text>
</svg>
